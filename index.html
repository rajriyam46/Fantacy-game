<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fantasy Dare Game 💋</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #fff0f5;
      padding: 40px;
      margin: 0;
    }
    h1 {
      color: #d63384;
      margin-bottom: 20px;
    }
    .btn {
      padding: 12px 20px;
      margin: 5px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      color: #fff;
      cursor: pointer;
      background-color: #888; /* default grey */
    }
    .btn.phase { background-color: #ff69b4; }
    .btn.subcat { background-color: #666; }
    .btn.subcat.active.him { background-color: #3399ff; }   /* blue */
    .btn.subcat.active.her { background-color: #ff3399; }   /* pink */
    .btn.control { background-color: #d63384; }
    .btn:hover { opacity: 0.9; }
    #dare {
      font-size: 1.3rem;
      margin: 40px 0;
      min-height: 80px;
      color: #333;
    }
    #controls {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Fantasy Dare Game 💋</h1>

  <!-- Phase selection -->
  <div id="phases">
    <button class="btn phase" onclick="selectPhase('strip')">Striptease</button>
    <button class="btn phase" onclick="selectPhase('foreplay')">Foreplay</button>
    <button class="btn phase" onclick="selectPhase('intimacy')">Intimacy</button>
  </div>

  <!-- Sub-category always visible -->
  <div id="subcats">
    <button id="btn-him" class="btn subcat" onclick="selectSubcat('him')">For Him</button>
    <button id="btn-her" class="btn subcat" onclick="selectSubcat('her')">For Her</button>
  </div>

  <!-- Dare display -->
  <div id="dare">Choose a phase and who’s up to begin</div>

  <!-- Next / Restart controls -->
  <div id="controls" style="display:none;">
    <button class="btn control" onclick="nextDare()">➡️ Next</button>
    <button class="btn control" onclick="restart()">🔁 Restart</button>
  </div>

  <script>
    // Data
    const dares = {
      strip: {
        him: [ /* ... your 20+ strip-him dares ... */ ],
        her: [ /* ... your 20+ strip-her dares ... */ ]
      },
      foreplay: {
        him: [ /* ... foreplay-him dares ... */ ],
        her: [ /* ... foreplay-her dares ... */ ]
      },
      intimacy: {
        him: [ /* ... intimacy-him dares ... */ ],
        her: [ /* ... intimacy-her dares ... */ ]
      }
    };

    // Example fill-in (copy your real lists here):
    dares.strip.him = [
      "Remove a piece using only one hand",
      "Remove while dancing to a song",
      /* etc... */
    ];
    dares.strip.her = [
      "Remove a piece using only one hand",
      "Remove while dancing to a song",
      /* etc... */
    ];
    dares.foreplay.him = [
      "Kiss passionately for 30 seconds",
      "Lick her neck slowly",
      /* etc... */
    ];
    dares.foreplay.her = [
      "Kiss him passionately for 30 seconds",
      "Lick his neck slowly",
      /* etc... */
    ];
    dares.intimacy.him = [
      "Try missionary position for 1 minute",
      "Try spooning position",
      /* etc... */
    ];
    dares.intimacy.her = [
      "Try missionary position for 1 minute",
      "Try spooning position",
      /* etc... */
    ];

    let selectedPhase = null;
    let selectedSubcat = null;
    let used = { strip: { him: new Set(), her: new Set() },
                 foreplay: { him: new Set(), her: new Set() },
                 intimacy: { him: new Set(), her: new Set() } };

    function selectPhase(phase) {
      selectedPhase = phase;
      document.getElementById('controls').style.display = 'block';
      document.getElementById('dare').innerText = `Phase: ${phase.toUpperCase()}, choose For Him or For Her.`;
    }

    function selectSubcat(subcat) {
      selectedSubcat = subcat;
      // highlight active subcat button
      document.getElementById('btn-him').classList.toggle('active', subcat==='him');
      document.getElementById('btn-her').classList.toggle('active', subcat==='her');
      // reset used for this subcat if you want fresh start
      used[selectedPhase][selectedSubcat] = new Set();
      nextDare();
    }

    function nextDare() {
      if (!selectedPhase || !selectedSubcat) {
        alert('Select a phase and who will perform!');
        return;
      }
      const list = dares[selectedPhase][selectedSubcat];
      const usedSet = used[selectedPhase][selectedSubcat];
      if (usedSet.size >= list.length) {
        document.getElementById('dare').innerText = 'All dares done! 🔁 Restart.';
        return;
      }
      let idx;
      do { idx = Math.floor(Math.random() * list.length); }
      while (usedSet.has(idx));
      usedSet.add(idx);
      const label = selectedSubcat === 'him' ? 'For Him:' : 'For Her:';
      document.getElementById('dare').innerText = `${label} ${list[idx]}`;
    }

    function restart() {
      selectedPhase = null;
      selectedSubcat = null;
      document.getElementById('phases').style.display = 'block';
      document.getElementById('dare').innerText = 'Choose a phase and who’s up to begin';
      document.getElementById('controls').style.display = 'none';
      document.getElementById('btn-him').classList.remove('active');
      document.getElementById('btn-her').classList.remove('active');
    }
  </script>
</body>
</html>
