<!DOCTYPE html>

  </style>
</head>
<body>
  <h1>Fantasy Dare Game 💋</h1>
  <div id="dare">Click "Start" to begin</div>
  <button onclick="nextDare()">➡️ Next</button>
  <button onclick="restart()">🔁 Restart</button>

  <script>
    const allDares = [
      // --- Strip Dares ---
      "Remove a piece using only one hand",
      "Remove a piece while dancing to a song",
      "Let your partner remove one item with their mouth",
      "Pretend it’s your first time undressing for your partner",

      "Remove a piece while turning around seductively",
      "Take off clothing in the style of a movie scene",
      "Remove something and toss it to your partner",
      "Let your partner choose what you take off",
      "Do a spin while removing a layer",
      "Remove something while blindfolded",
      "Say one compliment before taking something off",
      "Remove something while doing a silly dance",
      "Let your partner untie or unzip one piece",
      "Act surprised as if it’s the first time",
      "Whisper something naughty while undressing",

      // --- Foreplay Dares ---
      "Kiss passionately for 30 seconds",
      "Lick their neck slowly",
      "Give a sensual massage for 1 minute",
      "Nibble their ear gently",
      "Perform a slow striptease",
      "Give a lap dance",
      "Whisper your favorite fantasy",
      "Caress their chest area for 1 minute",
      "Kiss their inner thighs",
      "Tease their body without touching privates",
      "Blow softly near their private parts",
      "Use only tongue for 1 minute",
      "Suck on fingers suggestively",
      "Blindfold and kiss everywhere",
      "Do a slow grind for 30 seconds",

      // --- Mutual Intimacy / Positions ---
      "Look into each other's eyes for 30 seconds",
      "Share your deepest desire",
      "Try missionary position",
      "Try spooning position",
      "Try cowgirl position",
      "Let your partner take full control",
      "Explore each other’s bodies with fingertips",
      "Touch each other without kissing for 2 minutes",
      "Guide your partner’s hands",
      "Sync your breath together",
      "Moan each other’s name softly",
      "Lie on top and feel heartbeats",
      "Give 3 compliments before proceeding",
      "Ask 'Can I continue?' playfully"
    ];

    let shuffled = [];
    let currentIndex = 0;

    function shuffleList(list) {
      const newList = [...list];
      for (let i = newList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newList[i], newList[j]] = [newList[j], newList[i]];
      }
      return newList;
    }

    function nextDare() {
      if (currentIndex >= shuffled.length) {
        document.getElementById("dare").innerText = "All dares complete! 🔁 Restart to play again.";
        return;
      }
      document.getElementById("dare").innerText = shuffled[currentIndex];
      currentIndex++;
    }

    function restart() {
      shuffled = shuffleList(allDares);
      currentIndex = 0;
      nextDare();
    }

    // Initial shuffle
    shuffled = shuffleList(allDares);
  </script>
